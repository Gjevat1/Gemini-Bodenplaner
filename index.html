<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1e293b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Aufmaß & Grundriss Planer</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="app-icon-badge">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/>
        </svg>
      </div>
      <div class="project-title-wrap">
        <input type="text" id="projectName" value="Baustelle / Raum 1" aria-label="Projektname" />
        <span class="subtitle" id="scaleInfo">Raster: 1 Kästchen = 50 cm</span>
      </div>
    </div>

    <div class="top-actions">
      <button class="icon-btn" id="btnUndo" title="Rückgängig">↶</button>
      <button class="icon-btn" id="btnClear" title="Alles löschen">🗑️</button>
      <button class="icon-btn primary" id="btnProjects" title="Projekte & Export">💾</button>
    </div>
  </header>

  <!-- Live-Messwerte Leiste -->
  <section class="metrics-bar">
    <div class="metric-card">
      <span class="metric-label">Fläche</span>
      <span class="metric-value" id="valArea">0,00 m²</span>
    </div>
    <div class="metric-card">
      <span class="metric-label">Umfang gesamt</span>
      <span class="metric-value" id="valPerimeter">0,00 lfm</span>
    </div>
    <div class="metric-card accent">
      <span class="metric-label">Sockelleisten (-Türen)</span>
      <span class="metric-value" id="valSkirting">0,00 lfm</span>
    </div>
  </section>

  <!-- Zeichenfläche -->
  <main class="canvas-wrapper" id="canvasWrapper">
    <canvas id="planCanvas"></canvas>

    <!-- Zoom & Ansicht Controls -->
    <div class="floating-controls">
      <button class="fab-mini" id="btnZoomIn" title="Hineinzoomen">+</button>
      <button class="fab-mini" id="btnZoomOut" title="Herauszoomen">−</button>
      <button class="fab-mini" id="btnResetView" title="Zentrieren">⌖</button>
      <button class="fab-mini toggle-active" id="btnSnap" title="Rasterfang (10 cm)">🧲</button>
    </div>

    <!-- Kontext-Aktion für ausgewähltes Element -->
    <div class="selection-bar hidden" id="selectionBar">
      <span id="selectionLabel">Element ausgewählt</span>
      <div class="selection-btns">
        <button id="btnEditLength">📏 Maß</button>
        <button id="btnFlipElement">🔄 Drehen</button>
        <button id="btnDeleteSelected" class="danger">✕</button>
      </div>
    </div>
  </main>

  <!-- Kompakte Werkzeugleiste unten (finger- & stiftfreundlich) -->
  <footer class="toolbar">
    <div class="tool-grid">
      <button class="tool-btn active" data-tool="wall">
        <span class="tool-ico">✏️</span>
        <span class="tool-txt">Wand</span>
      </button>
      <button class="tool-btn" data-tool="door">
        <span class="tool-ico">🚪</span>
        <span class="tool-txt">Tür</span>
      </button>
      <button class="tool-btn" data-tool="window">
        <span class="tool-ico">🪟</span>
        <span class="tool-txt">Fenster</span>
      </button>
      <button class="tool-btn" data-tool="pattern">
        <span class="tool-ico">🪵</span>
        <span class="tool-txt">Verlegung</span>
      </button>
      <button class="tool-btn" data-tool="note">
        <span class="tool-ico">📝</span>
        <span class="tool-txt">Notiz</span>
      </button>
      <button class="tool-btn" data-tool="select">
        <span class="tool-ico">👆</span>
        <span class="tool-txt">Auswahl</span>
      </button>
    </div>
  </footer>

  <!-- Modal: Wandlänge / Öffnungsbreite exakt eingeben -->
  <div class="modal-backdrop hidden" id="lengthModal">
    <div class="modal-card">
      <h3 id="lengthModalTitle">Maß anpassen</h3>
      <p class="modal-hint" id="lengthModalHint">Länge in Zentimetern (cm) eingeben:</p>
      <div class="input-row">
        <input type="number" id="inputCm" inputmode="decimal" step="1" min="10" max="5000" />
        <span class="unit-tag">cm</span>
      </div>
      <div class="quick-presets" id="quickPresets">
        <button type="button" data-cm="80">80 cm</button>
        <button type="button" data-cm="90">90 cm</button>
        <button type="button" data-cm="100">100 cm</button>
        <button type="button" data-cm="120">120 cm</button>
        <button type="button" data-cm="200">200 cm</button>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="btnCancelLength">Abbrechen</button>
        <button class="btn-primary" id="btnSaveLength">Übernehmen</button>
      </div>
    </div>
  </div>

  <!-- Modal: Verlegerichtung & Muster -->
  <div class="modal-backdrop hidden" id="patternModal">
    <div class="modal-card">
      <h3>Verlegerichtung & Muster</h3>
      <div class="pattern-options">
        <button class="pattern-opt" data-pattern="none">Keine Anzeige</button>
        <button class="pattern-opt" data-pattern="plank-0">Dielen / Schiffsboden (0° Waagerecht)</button>
        <button class="pattern-opt" data-pattern="plank-90">Dielen / Schiffsboden (90° Senkrecht)</button>
        <button class="pattern-opt" data-pattern="plank-45">Diagonal (45°)</button>
        <button class="pattern-opt" data-pattern="herringbone">Fischgrät (Herringbone)</button>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="btnClosePattern">Schließen</button>
      </div>
    </div>
  </div>

  <!-- Modal: Notiz hinzufügen -->
  <div class="modal-backdrop hidden" id="noteModal">
    <div class="modal-card">
      <h3>Raum-Notiz / Baustellenhinweis</h3>
      <input type="text" id="inputNoteText" placeholder="z. B. Eiche Natur geölt, Untergrund schleifen..." maxlength="60" />
      <div class="modal-actions">
        <button class="btn-secondary" id="btnCancelNote">Abbrechen</button>
        <button class="btn-primary" id="btnSaveNote">Platzieren</button>
      </div>
    </div>
  </div>

  <!-- Modal: Speichern, Laden & Export -->
  <div class="modal-backdrop hidden" id="projectsModal">
    <div class="modal-card modal-large">
      <h3>Projekte & Export</h3>

      <div class="export-grid">
        <button class="export-btn" id="btnSaveLocal">
          <span>💾</span> Im Browser speichern
        </button>
        <button class="export-btn" id="btnExportPNG">
          <span>🖼️</span> Als Bild (PNG)
        </button>
        <button class="export-btn" id="btnPrintPDF">
          <span>📄</span> Drucken / PDF
        </button>
        <button class="export-btn" id="btnExportJSON">
          <span>📦</span> Backup (JSON)
        </button>
      </div>

      <div class="import-row">
        <label class="file-upload-btn">
          📂 JSON-Backup laden
          <input type="file" id="inputImportJSON" accept=".json,application/json" hidden />
        </label>
        <button class="btn-secondary small" id="btnNewProject">+ Neu</button>
      </div>

      <h4 class="list-heading">Gespeicherte Räume</h4>
      <div class="saved-list" id="savedProjectsList">
        <!-- Dynamisch gefüllt -->
      </div>

      <div class="modal-actions">
        <button class="btn-secondary" id="btnCloseProjects">Schließen</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
